[project]
name = "opsbot-ai"
version = "0.1.0"
description = "OpsBot AI/RAG service: document ingest, hybrid retrieval, LLM provider manager and agent loop"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.1.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "fastapi>=0.159.1",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "openai>=3.36.1",
    "pgvector>=0.5.1",
    "pillow>=12.3.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.2",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.0",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions/*.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PIE", "PT", "RET", "TID"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "RET504", "SIM108", "SIM112", "SIM905", "PT028"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N802", "PT018"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs the Postgres test database (opsbot_test on 5442)",
    "ocr: needs the Tesseract binary",
]
filterwarnings = ["ignore::DeprecationWarning:pytesseract.*"]
